<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผู้ดูแล CarrotOS</title><style>body{font:15px system-ui;background:#fffaf7;color:#302445;margin:0}main{max-width:1100px;margin:24px auto;padding:16px}section{background:white;border:1px solid #eadcf5;border-radius:16px;padding:16px;margin:14px 0}button{padding:8px 12px;border:1px solid #d9c9e5;border-radius:8px;background:white;color:#62447f;cursor:pointer;margin:3px}input{padding:9px;border:1px solid #d9c9e5;border-radius:8px}article{border-top:1px solid #eee;padding:12px 0}img{max-width:220px;max-height:300px;display:block}small{color:#786}</style><main><h1>🥕 แผงผู้ดูแล CarrotOS</h1><p>เข้าถึงได้เฉพาะอีเมลที่กำหนดใน ADMIN_EMAILS บน Render</p><section><h2>รายการ PromptPay รอตรวจ</h2><button id="refreshOrders">รีเฟรช</button><div id="orders"></div></section><section><h2>สมาชิก</h2><input id="q" placeholder="ค้นหาอีเมลหรือชื่อ"><button id="searchMembers">ค้นหา</button><div id="members"></div></section><section><h2>บันทึกผู้ดูแลล่าสุด</h2><button id="loadAudit">โหลดบันทึก</button><pre id="audit"></pre></section><p id="msg"></p></main><script>
const ordersBox=document.querySelector('#orders'),membersBox=document.querySelector('#members'),msg=document.querySelector('#msg');
async function act(action,data){const r=await fetch('/api/admin/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
function button(label,handler){const b=document.createElement('button');b.textContent=label;b.onclick=handler;return b}
async function loadOrders(){const r=await fetch('/api/admin/orders'),d=await r.json();ordersBox.replaceChildren();if(!r.ok){msg.textContent=d.error;return}if(!d.orders.length){ordersBox.textContent='ไม่มีรายการค้าง';return}for(const o of d.orders){const a=document.createElement('article'),title=document.createElement('b');title.textContent=`${o.email} · ${o.credits} เครดิต · ${(o.amount/100).toFixed(2)} บาท · ${o.status}`;a.append(title,document.createElement('br'));const detail=document.createElement('small');detail.textContent=`คำสั่ง ${o.id} · ${new Date(o.created_at).toLocaleString('th-TH')}`;a.append(detail);if(o.has_slip){const img=document.createElement('img');img.src='/api/admin/slips/'+encodeURIComponent(o.id);img.alt='สลิปโอนเงิน';a.append(img)}a.append(button('อนุมัติและเพิ่มเครดิต',()=>run('approve',{orderId:o.id})),button('ปฏิเสธ',()=>run('reject',{orderId:o.id})));ordersBox.append(a)}}
async function loadMembers(){const r=await fetch('/api/admin/members?q='+encodeURIComponent(document.querySelector('#q').value)),d=await r.json();membersBox.replaceChildren();if(!r.ok){msg.textContent=d.error;return}for(const m of d.members){const a=document.createElement('article'),title=document.createElement('b');title.textContent=`${m.email} · เครดิต ${m.credits} · ${m.email_verified?'ยืนยันแล้ว':'ยังไม่ยืนยัน'} · ${m.suspended?'ระงับ':'ปกติ'}`;a.append(title,document.createElement('br'));const detail=document.createElement('small');detail.textContent=`สมาชิก #${m.id} · ${new Date(m.created_at).toLocaleDateString('th-TH')}`;a.append(detail,document.createElement('br'),button('+1 เครดิต',()=>adjust(m.id,1)),button('−1 เครดิต',()=>adjust(m.id,-1)),button(m.suspended?'ปลดระงับ':'ระงับสมาชิก',()=>run(m.suspended?'unsuspend':'suspend',{memberId:m.id})));membersBox.append(a)}if(!d.members.length)membersBox.textContent='ไม่พบสมาชิก'}
async function adjust(id,delta){const reason=prompt('เหตุผลในการปรับเครดิต');if(reason===null)return;await run('adjust',{memberId:id,delta,reason})}
async function run(action,data){try{await act(action,data);msg.textContent='บันทึกแล้ว';await Promise.all([loadOrders(),loadMembers(),loadAudit()])}catch(e){msg.textContent=e.message}}
async function loadAudit(){const r=await fetch('/api/admin/audit'),d=await r.json();document.querySelector('#audit').textContent=r.ok?JSON.stringify(d.logs,null,2):d.error}
document.querySelector('#refreshOrders').onclick=loadOrders;document.querySelector('#searchMembers').onclick=loadMembers;document.querySelector('#loadAudit').onclick=loadAudit;loadOrders();loadMembers();loadAudit();
</script></html>
