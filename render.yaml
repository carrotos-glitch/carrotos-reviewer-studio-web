services:
  - type: web
    name: carrotos-reviewer-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://carrotos-reviewer-studio.onrender.com
      - key: APP_ACCESS_CODE
        sync: false
