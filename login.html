<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ef"><title>เข้าใช้งาน · CarrotOS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 15% 0,#fff0dc,transparent 35%),#faf6ff;font-family:Kanit,system-ui,sans-serif;color:#352648}.box{width:min(480px,100%);background:white;border:1px solid #eee4f2;border-radius:24px;padding:36px;box-shadow:0 18px 52px #55316c17}.brand{font-weight:700;color:#68468c;margin-bottom:18px}.brand span{font-size:26px;margin-right:8px}h1{font-size:26px;margin:0 0 8px}p{color:#766c80;line-height:1.7;margin:8px 0 22px}label{display:block;font-size:14px;font-weight:500;margin-bottom:7px}input{width:100%;border:1px solid #d9c9e5;border-radius:12px;padding:13px 14px;font:16px Kanit,system-ui;outline:none}input:focus{border-color:#8c62b2;box-shadow:0 0 0 3px #8c62b21b}button{width:100%;margin-top:14px;border:0;border-radius:11px;padding:13px;background:linear-gradient(90deg,#fa397c,#ec3572);color:white;font:500 16px Kanit,system-ui;cursor:pointer}.status{min-height:24px;margin-top:12px;color:#b2394f;font-size:13px}.small{color:#8a8191;font-size:12px;margin-top:18px}
</style></head><body><main class="box"><div class="brand"><span>🥕</span>CarrotOS Reviewer Studio</div><h1>เข้าใช้งานเว็บ</h1><p>ใส่รหัสที่เจ้าของเว็บให้ไว้ เพื่อเริ่มสร้างคอนเทนต์รีวิว</p><form id="loginForm"><label for="code">รหัสเข้าใช้งาน</label><input id="code" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">เข้าใช้งาน</button><div id="status" class="status" role="status"></div></form><div class="small">หากไม่มีรหัสนี้ กรุณาขอจากเจ้าของเว็บ</div></main><script>
const form=document.getElementById('loginForm'),code=document.getElementById('code'),submit=document.getElementById('submit'),statusBox=document.getElementById('status');form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='กำลังตรวจสอบ…';statusBox.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({accessCode:code.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'ใส่รหัสไม่สำเร็จ');location.href='/'}catch(error){statusBox.textContent=error.message;submit.disabled=false;submit.textContent='เข้าใช้งาน'}};
</script></body></html>
